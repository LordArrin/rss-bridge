[global]
error_log = /proc/self/fd/2
log_limit = 8192

; Emergency restart settings (must be in global section)
emergency_restart_threshold = 10
emergency_restart_interval = 1m

; No core dumps: PHP 8.6 abort()s on hard OOM; cores would leak cache contents
; and fill the disk. rlimit_core is inherited by all FPM workers.
rlimit_core = 0

include=/etc/php/php-fpm.d/*.conf
