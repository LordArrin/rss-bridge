server {
    listen 80;
    server_name _;

    root /app;
    index index.php;

    # Security
    server_tokens off;
    
    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Logging
    access_log /dev/stdout combined buffer=16k flush=2s;
    error_log /dev/stderr warn;

    # Client body size
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 3;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        application/font-woff
        application/font-woff2;

    # Static files with long cache
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Favicon and robots.txt
    location = /favicon.ico {
        expires 30d;
        access_log off;
    }

    location = /robots.txt {
        access_log off;
    }

    # Main routing
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # PHP processing
    location ~ \.php$ {
        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_pass unix:/run/php85/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Buffers
        fastcgi_buffers 32 32k;
        fastcgi_buffer_size 64k;
        fastcgi_busy_buffers_size 128k;
        fastcgi_temp_file_write_size 256k;

        # Timeouts (some bridges fetch slow remote pages)
        fastcgi_connect_timeout 10s;
        fastcgi_send_timeout 180s;
        fastcgi_read_timeout 180s;

        # Keep-alive for connection reuse
        fastcgi_keep_conn on;

        # Request body buffering
        fastcgi_request_buffering off;

        # Hide PHP errors in response
        fastcgi_intercept_errors off;
    }

    # Deny access to sensitive directories
    location ~ ^/(\.|vendor|tests|config|bin|caches|lib|middlewares|templates) {
        deny all;
        return 403;
    }

    # Deny access to dotfiles
    location ~ /\. {
        deny all;
    }

    # Deny direct access to PHP files in bridge/format directories
    location ~ ^/bridges/.*\.php$ {
        deny all;
    }

    location ~ ^/bridges-v2/.*\.php$ {
        deny all;
    }

    location ~ ^/formats/.*\.php$ {
        deny all;
    }

    location ~ ^/middlewares/.*\.php$ {
        deny all;
    }
}
