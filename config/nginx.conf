server {
    listen 80;
    listen [::]:80;
    server_name _;

    # HTTP/2 and HTTP/3 (QUIC) are available in the compiled freenginx.
    # To enable, uncomment the lines below and configure SSL certificates.
    # listen 443 ssl;
    # listen [::]:443 ssl;
    # http2 on;
    # http3 on;
    # quic_retry on;

    root /app;
    index index.php;

    # Security
    server_tokens off;

    # Security Headers (using headers-more-nginx-module)
    more_set_headers "X-Frame-Options: SAMEORIGIN" always;
    more_set_headers "X-Content-Type-Options: nosniff" always;
    more_set_headers "X-XSS-Protection: 1; mode=block" always;
    more_set_headers "Referrer-Policy: no-referrer-when-downgrade" always;
    more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains" always;
    more_set_headers "Permissions-Policy: camera=(), microphone=(), geolocation=()" always;

    # Logging. Health-check spam is suppressed at the source: the
    # HEALTHCHECK in the Dockerfile hits /healthcheck.txt (a static file,
    # see location below) instead of the PHP app, so no "?action=health"
    # requests are generated anymore. The old conditional-logging block
    # ("if ($arg_action = health) set $loggable 0") never actually worked:
    # the nginx docs explicitly state that "if" does not change variable
    # values for directives outside the current location block, so
    # access_log always received loggable=1 and every poll was logged as
    # '- - "GET /index.php" 200'.
    access_log /dev/stdout combined buffer=16k flush=2s;
    error_log /dev/stderr warn;

    # Client body size
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 3;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        application/font-woff
        application/font-woff2;

    # Brotli compression (new module)
    brotli on;
    brotli_comp_level 3;
    brotli_min_length 256;
    brotli_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        application/font-woff
        application/font-woff2;

    # Static files with long cache
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Favicon and robots.txt
    location = /favicon.ico {
        expires 30d;
        access_log off;
    }

    location = /robots.txt {
        access_log off;
    }

    # Docker HEALTHCHECK endpoint: plain static file, no PHP involved.
    # Replaces the old "?action=health" polling which produced one
    # access-log line every 30s (the "GET /index.php 200" spam) and ran
    # the full middleware stack on every poll.
    location = /healthcheck.txt {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Main routing
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # PHP processing
    location ~ \.php$ {
        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_pass unix:/run/php85/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Buffers
        fastcgi_buffers 32 32k;
        fastcgi_buffer_size 64k;
        fastcgi_busy_buffers_size 128k;
        fastcgi_temp_file_write_size 256k;

        # Timeouts (some bridges fetch slow remote pages)
        fastcgi_connect_timeout 10s;
        fastcgi_send_timeout 180s;
        fastcgi_read_timeout 180s;

        # Keep-alive for connection reuse
        fastcgi_keep_conn on;

        # Request body buffering
        fastcgi_request_buffering off;

        # Hide PHP errors in response
        fastcgi_intercept_errors off;
    }

    # Deny access to sensitive directories
    location ~ ^/(\.|vendor|tests|config|bin|caches|lib|middlewares|templates) {
        deny all;
        return 403;
    }

    # Deny access to dotfiles
    location ~ /\. {
        deny all;
    }

    # Deny direct access to PHP files in bridge/format directories
    location ~ ^/bridges/.*\.php$ {
        deny all;
    }

    location ~ ^/bridges-v2/.*\.php$ {
        deny all;
    }

    location ~ ^/formats/.*\.php$ {
        deny all;
    }

    location ~ ^/middlewares/.*\.php$ {
        deny all;
    }
}