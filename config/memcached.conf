# =============================================================================
# Memcached configuration (single source of truth)
# =============================================================================
# This file consolidates ALL embedded memcached settings that were previously
# scattered across:
#   - config.default.ini.php  ([MemcachedCache] section)
#   - memcached-config.php    (default fallback values)
#   - docker-entrypoint.sh    (memcached command-line flags)
#   - Dockerfile              (MEMCACHED_VERSION build arg)
#
# It is parsed by docker-entrypoint.sh at container startup. Values here are
# defaults: any key set in [MemcachedCache] of config.ini.php overrides them.
#
# NOTE: the PHP client (caches/MemcachedCache.php) enforces a hard protocol
# limit of 1 MB per item regardless of item_size_limit; larger values are
# chunked client-side. The server-side -I flag below only controls slab sizes
# and network read limits, so it should stay >= the largest single chunk
# (~960 KB) plus header overhead. 8M is a safe, generous value.
# =============================================================================

[memory]
# Max memory for memcached (-m). Default: 512 megabytes.
value = 512m

[connections]
# Max simultaneous connections (-c). Default: 1024.
value = 1024

[threads]
# Number of worker threads (-t). Default: 4.
value = 4

[item_size_limit]
# Max item size accepted by the server (-I). Default: 32M.
# Kept large to avoid E2BIG on network reads; real per-item cap is enforced
# client-side at 1 MB with automatic chunking.
value = 32M

[socket_path]
# Unix socket path for internal mode. Default: /var/run/memcached/memcached.sock
value = /var/run/memcached/memcached.sock

[hash_power]
# Initial slab hash table power (-o hashpower=N). Default: 16.
value = 16

[backlog]
# Listen backlog (-b). Default: 1024.
value = 1024

[idle_timeout]
# Max requests per event loop iteration (-R). 0 = disabled (default).
value = 0

[verbosity]
# Verbose logging flag (-v). 0 = off (default), 1 = on.
value = 0

[modern]
# Enable modern slabs allocator (-o modern). true|false. Default: true.
value = true

[prealloc]
# Enable slab reassign + automove (-o slab_reassign -o slab_automove).
# true|false. Default: true.
value = true

[lock_memory]
# Lock all pages in memory (-r). Requires CAP_IPC_LOCK. true|false. Default: false.
value = false

# -----------------------------------------------------------------------------
# PHP client settings (used by caches/CacheFactory.php -> MemcachedCache)
# These do NOT map to memcached command-line flags; they control how the
# PHP-side chunking layer splits values that exceed the 1 MB protocol cap.
# -----------------------------------------------------------------------------

[client_chunk_size]
# Max serialized payload stored under a single memcached key, in bytes.
# Must be <= 1048576 (hard protocol limit). Default: 983040 (960 KB),
# leaving ~64 KB headroom for key + serialization overhead.
value = 983040

[client_max_chunks]
# Guard against runaway values: logical items requiring more chunks than this
# are refused with a warning instead of flooding memory. Default: 128
# (128 * 960 KB = ~120 MB max per cached item).
value = 128
