; === Logging ===
fastcgi.logging = Off
log_errors = On
error_log = /proc/self/fd/2

; === Error Reporting ===
; Suppress deprecation notices in production
; (curl_close() deprecated in 8.5, $http_response_header deprecated, etc.)
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off

; === Memory ===
memory_limit = 512M

; === Timeouts ===
max_execution_time = 180
max_input_time = 60
max_input_vars = 10000

; === Session ===
session.gc_maxlifetime = 1440
session.cookie_httponly = 1
session.cookie_secure = 0
session.use_strict_mode = 1

; === Realpath cache ===
realpath_cache_size = 4096K
realpath_cache_ttl = 7200

; === OPcache (built into PHP 8.5 core) ===
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.save_comments = 1

; File cache for faster cold starts
opcache.file_cache = /app/cache/opcache
opcache.file_cache_only = 0
opcache.file_cache_consistency_checks = 1

; === JIT ===
; Using default limits for PHP 8.5 (jit_max_recursive_returns/calls = 2)
opcache.jit = 1255
opcache.jit_buffer_size = 128M
opcache.jit_debug = 0
opcache.jit_max_root_traces = 1024
opcache.jit_max_side_traces = 128
opcache.jit_max_exit_counters = 8192

; === Uploads ===
file_uploads = Off
upload_max_filesize = 2M
post_max_size = 2M

; === Security ===
expose_php = Off
allow_url_fopen = On
allow_url_include = Off

; === CURL ===
curl.timeout = 60