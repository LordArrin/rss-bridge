; === Logging ===
fastcgi.logging = Off
log_errors = On
error_log = /proc/self/fd/2

; === Error Reporting ===
; Suppress deprecation notices in production
; (curl_close() deprecated in 8.5, $http_response_header deprecated, etc.)
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
fatal_error_backtraces=0

; === Memory ===
memory_limit = 512M

; === Timeouts ===
max_execution_time = 175
max_input_time = 60
max_input_vars = 10000

; === Session ===
session.gc_maxlifetime = 1440
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Strict
session.use_strict_mode = 1

; === Realpath cache ===
realpath_cache_size = 8192K
realpath_cache_ttl = 7200

; === OPcache ===
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 30000

; Option 1: For production
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

; Option 2: For development/testing
; opcache.validate_timestamps = 1
; opcache.revalidate_freq = 2

opcache.save_comments = 1

; File cache for faster cold starts
opcache.file_cache = /app/cache/opcache
opcache.file_cache_only = 0
opcache.file_cache_consistency_checks = 1

; === JIT ===
opcache.jit = 1205
opcache.jit_buffer_size = 256M
opcache.jit_debug = 0
opcache.jit_max_root_traces = 1024
opcache.jit_max_side_traces = 128
opcache.jit_max_exit_counters = 8192

; === Uploads ===
file_uploads = Off
upload_max_filesize = 2M
post_max_size = 8M
session.upload_progress.enabled=0

; === Security ===
expose_php = Off
allow_url_fopen = On
allow_url_include = Off

; === OPcache Preload ===
opcache.preload = /app/config/preload.php
opcache.preload_user = nginx
