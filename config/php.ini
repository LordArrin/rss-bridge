; === Logging ===
fastcgi.logging = Off

; === Timeouts ===
fastcgi_read_timeout 120s;
fastcgi_send_timeout 120s;

; Suppress deprecation notices in production
; (curl_close() deprecated in 8.5, $http_response_header deprecated, etc.)
error_reporting = E_ALL & ~E_DEPRECATED

; === Memory ===
memory_limit = 512M

; === OPcache (built into PHP 8.5 core) ===
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1

; === JIT ===
; For I/O-bound apps (RSS-Bridge fetches remote HTML), JIT adds overhead
; without measurable gain. Disabled intentionally.
opcache.jit = off

; === Realpath cache ===
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; === Uploads (not needed, but sane defaults) ===
upload_max_filesize = 2M
post_max_size = 2M

; === Misc ===
expose_php = Off
max_execution_time = 120
max_input_time = 30