[rss-bridge]
user = nginx
group = nginx

listen = /run/php85/php-fpm.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660
listen.backlog = 511

access.log = /proc/self/fd/2

clear_env = no

catch_workers_output = yes
decorate_workers_output = no

; Process management for container with limited memory
pm = dynamic
pm.max_children = 30
pm.start_servers = 5
pm.min_spare_servers = 3
pm.max_spare_servers = 8
pm.max_requests = 500
pm.process_idle_timeout = 10s

; A single feed fetch can legitimately take several cURL timeouts
; ([http] timeout x attempts). Without this setting php-fpm kills the worker
; mid-request (or never), and hung workers starve the pool, which shows up as
; "cURL error 28 ... 0 bytes received" on unrelated feeds. Keep this above
; the worst-case request duration of lib/http.php (~timeout*(retries+1)*1.35).
request_terminate_timeout = 120s

