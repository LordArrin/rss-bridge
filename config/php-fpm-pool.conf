[rss-bridge]
user = nginx
group = nginx

listen = /run/php85/php-fpm.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660
listen.backlog = 511

access.log = /proc/self/fd/2

clear_env = no

catch_workers_output = yes
decorate_workers_output = no

; Process management for container with limited memory
pm = dynamic
pm.max_children = 15
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500
pm.process_idle_timeout = 10s

