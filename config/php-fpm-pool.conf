[rss-bridge]
user = nginx
group = nginx

listen = /run/php85/php-fpm.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660

access.log = /proc/self/fd/2

clear_env = no

catch_workers_output = yes
decorate_workers_output = no

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3