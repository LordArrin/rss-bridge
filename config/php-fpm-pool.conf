[rss-bridge]
user = nginx
group = nginx

listen = /run/php85/php-fpm.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660
listen.backlog = 511

access.log = /proc/self/fd/2

clear_env = no

catch_workers_output = yes
decorate_workers_output = no

; Process management for container with limited memory
pm = dynamic
; Sizing rationale (1 CPU container): every busy worker can block on curl for
; up to the http timeout, so a large pool only converts one slow upstream into
; memory pressure and context thrashing without raising real throughput.
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
pm.process_idle_timeout = 10s

; Hard wall-clock limit per request. Timeout cascade (recommendation 3.2):
;   curl http.timeout (60s) < request_terminate_timeout (90s)
;   < max_execution_time (180s) = nginx fastcgi_read_timeout (180s)
; The worker is SIGTERM-terminated before nginx gives up, so php-fpm logs a
; clean "execution timed out" instead of nginx silently returning 500/504 and
; the pool staying blocked behind a hung curl handle.
request_terminate_timeout = 90s

