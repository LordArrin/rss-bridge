name: Build and Deploy Pages

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug - Show repository structure
        run: |
          echo "=== Repository root ==="
          ls -la
          echo ""
          echo "=== Looking for specific-bridges directory ==="
          find . -type d -name "specific-bridges" 2>/dev/null || echo "Not found anywhere"
          echo ""
          echo "=== Content of documentation/pages/specific-bridges ==="
          if [ -d "documentation/pages/specific-bridges" ]; then
            ls -la documentation/pages/specific-bridges/
          else
            echo "⚠️  Directory does not exist"
          fi

      - name: Extract bridge metadata
        run: |
          php .github/workflows/extract-bridges.php > bridges.json
          echo "✓ Generated bridges.json ($(wc -c < bridges.json) bytes)"

      - name: Generate specific-bridges.json
        run: |
          SPECIFIC_DIR="documentation/pages/specific-bridges"
          OUTPUT_FILE="specific-bridges.json"
          
          echo "=== Generating specific-bridges.json ==="
          
          # Always create the file (even if empty)
          echo "[" > "$OUTPUT_FILE"
          
          # Check if directory exists
          if [ ! -d "$SPECIFIC_DIR" ]; then
            echo "⚠️  Directory $SPECIFIC_DIR does not exist"
            echo "]" >> "$OUTPUT_FILE"
            echo "✓ Created empty $OUTPUT_FILE"
            exit 0
          fi
          
          # Count HTML files
          FILE_COUNT=$(find "$SPECIFIC_DIR" -maxdepth 1 -name "*.html" -type f 2>/dev/null | wc -l)
          echo "Found $FILE_COUNT HTML files"
          
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "⚠️  No HTML files found in $SPECIFIC_DIR"
            echo "]" >> "$OUTPUT_FILE"
            echo "✓ Created empty $OUTPUT_FILE"
            exit 0
          fi
          
          # Build JSON
          cd "$SPECIFIC_DIR"
          FIRST=true
          
          for f in *.html; do
            [ -f "$f" ] || continue
            NAME="${f%.html}"
            
            # Extract URI from meta comment
            URI=$(grep -m1 "<!-- meta:uri:" "$f" 2>/dev/null | sed 's/.*<!-- meta:uri:\(.*\) -->.*/\1/' | sed 's/"/\\"/g' || echo "")
            
            if [ "$FIRST" = true ]; then
              FIRST=false
            else
              echo "," >> "../$OUTPUT_FILE"
            fi
            
            echo "  ✓ Processing: $NAME (uri: $URI)"
            printf '  {"name":"%s","file":"%s","uri":"%s"}' "$NAME" "$f" "$URI" >> "../$OUTPUT_FILE"
          done
          
          echo "" >> "../$OUTPUT_FILE"
          echo "]" >> "../$OUTPUT_FILE"
          
          cd ..
          echo "✓ Generated $OUTPUT_FILE ($(wc -c < "$OUTPUT_FILE") bytes)"
          echo "Content preview:"
          head -20 "$OUTPUT_FILE"

      - name: Verify files
        run: |
          echo "=== Final file check ==="
          for file in index.html style.css bridges.json specific-bridges.json; do
            if [ -f "$file" ]; then
              echo "✓ $file ($(wc -c < "$file") bytes)"
            else
              echo "✗ $file MISSING"
            fi
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show deployment URL
        run: |
          echo "✓ Deployed to: ${{ steps.deployment.outputs.page_url }}"