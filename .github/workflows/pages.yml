name: Build and Deploy Pages

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site/static _site/documentation/pages
          cp documentation/pages/static/index.html _site/index.html
          cp documentation/pages/static/style.css _site/style.css
          cp static/favicon.svg static/favicon.png static/not_boring_logo.png _site/static/
          for dir in setup specific-bridges proxies; do
            if [ -d "documentation/pages/$dir" ]; then
              cp -r "documentation/pages/$dir" "_site/documentation/pages/$dir"
            else
              echo "::warning::documentation/pages/$dir not found, skipped"
            fi
          done

      - name: Inject image version
        run: |
          VERSION=$(grep -E '^ARG IMAGE_VERSION=' Dockerfile | head -n1 | sed 's/^ARG IMAGE_VERSION=//')
          if [ -z "$VERSION" ] || [ "$VERSION" = "0.0.0-dev" ]; then
            echo "Dockerfile has no valid IMAGE_VERSION: '${VERSION}'"
            exit 1
          fi
          grep -q "__RSSBRIDGE_IMAGE_VERSION__" _site/index.html
          sed -i "s/__RSSBRIDGE_IMAGE_VERSION__/${VERSION}/g" _site/index.html
          echo "Injected version from Dockerfile: ${VERSION}"

      - name: Extract bridge metadata
        run: |
          php .github/workflows/extract-bridges.php > _site/bridges.json
          echo "bridges.json: $(wc -c < _site/bridges.json) bytes"

      - name: Generate documentation indexes
        run: |
          python3 << 'PYTHON_SCRIPT'
          import json
          import os
          import re

          def collect(directory, output):
              entries = []
              if os.path.isdir(directory):
                  for filename in sorted(f for f in os.listdir(directory) if f.endswith('.html')):
                      with open(os.path.join(directory, filename), encoding='utf-8') as handle:
                          content = handle.read()
                      match = re.search(r'<!--\s*meta:uri:(.*?)\s*-->', content)
                      entries.append({
                          'name': filename[:-5],
                          'file': filename,
                          'uri': match.group(1).strip() if match else '',
                      })
              with open(output, 'w', encoding='utf-8') as handle:
                  json.dump(entries, handle, ensure_ascii=False)
              print(f'{output}: {len(entries)} entries')

          collect('documentation/pages/specific-bridges', '_site/specific-bridges.json')
          collect('documentation/pages/proxies', '_site/proxies.json')
          PYTHON_SCRIPT

      - name: Verify site
        run: |
          for file in index.html style.css bridges.json specific-bridges.json proxies.json; do
            if [ ! -f "_site/$file" ]; then
              echo "_site/$file is missing"
              exit 1
            fi
            echo "_site/$file: $(wc -c < "_site/$file") bytes"
          done
          test -f _site/static/not_boring_logo.png
          test -f _site/documentation/pages/setup/basics.html
          if grep -q "__RSSBRIDGE_IMAGE_VERSION__" _site/index.html; then
            echo "version placeholder was not substituted"
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show deployment URL
        run: |
          echo "Deployed to: ${{ steps.deployment.outputs.page_url }}"
