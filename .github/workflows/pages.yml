name: Build and Deploy Pages

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate bridges.json
        run: |
          cd bridges-v2
          ls -1 *.php | sed 's/\.php$//' | jq -R -s 'split("\n") | map(select(length > 0))' > ../bridges.json
          echo "Generated bridges.json with $(jq length ../bridges.json) bridges"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4