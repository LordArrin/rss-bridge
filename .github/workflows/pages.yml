name: Build and Deploy Pages

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract bridge metadata
        run: |
          php .github/workflows/extract-bridges.php > bridges.json
          echo "Generated bridges.json"

      - name: Generate specific-bridges.json
        run: |
          cd docs/pages/specific-bridges || exit 0
          RESULT="["
          FIRST=true
          for f in *.html; do
            [ -f "$f" ] || continue
            NAME="${f%.html}"
            # Extract URI from meta comment (first line)
            URI=$(grep -m1 "<!-- meta:uri:" "$f" 2>/dev/null | sed 's/.*<!-- meta:uri:\(.*\) -->.*/\1/' || echo "")
            # Escape quotes in URI for JSON
            URI=$(echo "$URI" | sed 's/"/\\"/g')
            
            if [ "$FIRST" = true ]; then
              FIRST=false
            else
              RESULT="$RESULT,"
            fi
            RESULT="$RESULT{\"name\":\"$NAME\",\"file\":\"$f\",\"uri\":\"$URI\"}"
          done
          RESULT="$RESULT]"
          echo "$RESULT" > ../../specific-bridges.json
          echo "Generated specific-bridges.json with $(echo "$RESULT" | grep -o '"name"' | wc -l) bridges"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4