name: Build and push images

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lordarrin/rss-bridge

jobs:
  build-amd64:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set date tag
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Build and push latest-modern (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-modern-amd64
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.date.outputs.date }}-modern-amd64
          build-args: |
            X86_MARCH=x86-64-v3
            X86_MTUNE=generic
            X86_CFI_FLAGS=-fcf-protection=full
            BUILD_JOBS=2
            ENABLE_LTO=ON
          cache-from: type=gha,scope=amd64-modern
          cache-to: type=gha,mode=max,scope=amd64-modern

      - name: Build and push latest (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-amd64
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.date.outputs.date }}-amd64
          build-args: |
            X86_MARCH=x86-64
            X86_MTUNE=generic
            X86_CFI_FLAGS=
            BUILD_JOBS=2
            ENABLE_LTO=ON
          cache-from: type=gha,scope=amd64-base
          cache-to: type=gha,mode=max,scope=amd64-base

  build-arm64:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set date tag
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Build and push latest-modern (arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-modern-arm64
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.date.outputs.date }}-modern-arm64
          build-args: |
            ARM_MARCH=armv8.2-a+crypto+crc+lse+rdma
            ARM_MTUNE=generic
            ARM_CFI_FLAGS=-mbranch-protection=standard
            BUILD_JOBS=2
            ENABLE_LTO=ON
          cache-from: type=gha,scope=arm64-modern
          cache-to: type=gha,mode=max,scope=arm64-modern

      - name: Build and push latest (arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-arm64
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.date.outputs.date }}-arm64
          build-args: |
            ARM_MARCH=armv8-a
            ARM_MTUNE=generic
            ARM_CFI_FLAGS=-mbranch-protection=standard
            BUILD_JOBS=2
            ENABLE_LTO=ON
          cache-from: type=gha,scope=arm64-base
          cache-to: type=gha,mode=max,scope=arm64-base

  create-manifests:
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set date tag
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Create and push latest-modern manifest
        run: |
          docker buildx imagetools create -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-modern \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-modern-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-modern-arm64
          docker buildx imagetools create -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.date.outputs.date }}-modern \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.date.outputs.date }}-modern-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.date.outputs.date }}-modern-arm64

      - name: Create and push latest manifest
        run: |
          docker buildx imagetools create -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-arm64
          docker buildx imagetools create -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.date.outputs.date }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.date.outputs.date }}-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.date.outputs.date }}-arm64

  sync-to-dockerhub:
    needs: create-manifests
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read

    steps:
      - name: Set date tag
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Log in to GHCR
        run: |
          skopeo login ghcr.io \
            --username ${{ github.repository_owner }} \
            --password ${{ secrets.GHCR_TOKEN }}

      - name: Log in to Docker Hub
        run: |
          skopeo login docker.io \
            --username ${{ secrets.DOCKERHUB_USERNAME }} \
            --password ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Sync images to Docker Hub
        run: |
          IMAGE="${{ env.IMAGE_NAME }}"
          DATE="${{ steps.date.outputs.date }}"
          
          echo "Syncing multi-architecture images to Docker Hub..."
          
          # Sync latest tags
          echo "Syncing $IMAGE:latest ..."
          skopeo copy --all \
            "docker://ghcr.io/$IMAGE:latest" \
            "docker://docker.io/$IMAGE:latest"
          
          echo "Syncing $IMAGE:latest-modern ..."
          skopeo copy --all \
            "docker://ghcr.io/$IMAGE:latest-modern" \
            "docker://docker.io/$IMAGE:latest-modern"
          
          # Sync date-tagged versions
          echo "Syncing $IMAGE:$DATE ..."
          skopeo copy --all \
            "docker://ghcr.io/$IMAGE:$DATE" \
            "docker://docker.io/$IMAGE:$DATE"
          
          echo "Syncing $IMAGE:$DATE-modern ..."
          skopeo copy --all \
            "docker://ghcr.io/$IMAGE:$DATE-modern" \
            "docker://docker.io/$IMAGE:$DATE-modern"
          
          echo "All images synced successfully to Docker Hub"