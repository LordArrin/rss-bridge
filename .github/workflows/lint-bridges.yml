name: Lint Bridges

on:
  push:
    branches: [master]
    paths:
      - 'bridges/**'
      - 'phpcs.xml'
      - '.github/workflows/lint-bridges.yml'
  pull_request:
    branches: [master]
    paths:
      - 'bridges/**'
      - 'phpcs.xml'
      - '.github/workflows/lint-bridges.yml'
  workflow_dispatch:
    inputs:
      check_mode:
        description: 'Check mode'
        required: true
        type: choice
        options:
          - 'changed_only'
          - 'all_bridges'
        default: 'all_bridges'

permissions:
  contents: write
  pull-requests: read

jobs:
  phpcs:
    name: PHP_CodeSniffer
    runs-on: ubuntu-latest-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Determine changed bridge files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.check_mode }}" = "all_bridges" ]; then
              FILES=$(find bridges -maxdepth 1 -name '*.php' -type f | tr '\n' ' ')
              echo "Running manual check on ALL bridge files"
            else
              if git rev-parse HEAD~1 >/dev/null 2>&1; then
                BASE="HEAD~1"
              else
                BASE=""
              fi
              
              if [ -n "$BASE" ]; then
                FILES=$(git diff --name-only --diff-filter=ACMR "$BASE"...HEAD -- 'bridges/*.php' | tr '\n' ' ')
              else
                FILES=$(find bridges -maxdepth 1 -name '*.php' -type f | tr '\n' ' ')
              fi
              echo "Running manual check on CHANGED bridge files only"
            fi
          # Pull request
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            FILES=$(git diff --name-only --diff-filter=ACMR "$BASE"...HEAD -- 'bridges/*.php' | tr '\n' ' ')
            echo "Checking PR changes against $BASE"
          else
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              BASE="HEAD~1"
            else
              BASE=""
            fi
            
            if [ -n "$BASE" ]; then
              FILES=$(git diff --name-only --diff-filter=ACMR "$BASE"...HEAD -- 'bridges/*.php' | tr '\n' ' ')
              echo "Checking push changes against $BASE"
            else
              FILES=$(find bridges -maxdepth 1 -name '*.php' -type f | tr '\n' ' ')
              echo "Initial commit - checking all files"
            fi
          fi

          FILES=$(echo "$FILES" | xargs)

          if [ -z "$FILES" ]; then
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No bridge files to check."
          else
            echo "has_files=true" >> "$GITHUB_OUTPUT"
            echo "files=$FILES" >> "$GITHUB_OUTPUT"
            echo "Files to check:"
            echo "$FILES" | tr ' ' '\n'
          fi

      - name: Run phpcbf on changed bridges (PR only)
        if: steps.changed.outputs.has_files == 'true' && github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          echo "Attempting to fix files: ${{ steps.changed.outputs.files }}"
          ./vendor/bin/phpcbf ${{ steps.changed.outputs.files }} --standard=phpcs.xml --extensions=php -v || echo "phpcbf exited with code $?"
          
          echo "Git status after phpcbf:"
          git status
          echo "Git diff stat:"
          git diff --stat

      - name: Commit fixed files
        if: steps.changed.outputs.has_files == 'true' && github.event_name == 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "style: fix phpcs issues"
          branch: ${{ github.head_ref }}
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_options: '--no-verify'

      - name: Run phpcs on bridge files
        if: steps.changed.outputs.has_files == 'true'
        run: |
          ./vendor/bin/phpcs \
            ${{ steps.changed.outputs.files }} \
            --standard=phpcs.xml \
            --warning-severity=0 \
            --extensions=php \
            -p

  executable-check:
    name: Executable PHP files check
    runs-on: ubuntu-latest-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check for executable PHP files in bridges/
        run: |
          if find bridges -name "*.php" -executable -type f -print -exec false {} +
          then
            echo 'Good, no executable php scripts found in bridges/'
          else
            echo '::error::Please unmark php scripts above as non-executable'
            echo 'You can do it with: git update-index --chmod=-x <file>'
            exit 1
          fi