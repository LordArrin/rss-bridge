name: Update Dockerfile Dependencies

on:
  schedule:
    # Runs every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  update-dependency:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # fail-fast: false ensures that if one dependency check fails, 
    # the others will still finish and create their respective PRs.
    strategy:
      fail-fast: false
      matrix:
        dep: [
          "ALPINE_VERSION",
          "NGINX_VERSION",
          "CURL_VERSION",
          "OPENSSL_VERSION",
          "PCRE_VERSION",
          "MIMALLOC_VERSION",
          "ZLIB_NG_VERSION",
          "LIBEVENT_VERSION",
          "MEMCACHED_VERSION"
        ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch latest version and patch Dockerfile
        id: check_version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > update_deps.py
          import urllib.request
          import json
          import re
          import os
          import sys

          # Configuration mapping: ARG_NAME -> (SOURCE, STRIP_PREFIX)
          DEPS_CONFIG = {
              "ALPINE_VERSION": ("alpine_docker", ""),
              "NGINX_VERSION": ("freenginx", ""),
              "CURL_VERSION": ("lwthiker/curl-impersonate", "v"),
              "OPENSSL_VERSION": ("openssl/openssl", "openssl-"),
              "PCRE_VERSION": ("PCRE2Project/pcre2", "pcre2-"),
              "MIMALLOC_VERSION": ("microsoft/mimalloc", "v"),
              "ZLIB_NG_VERSION": ("zlib-ng/zlib-ng", "v"),
              "LIBEVENT_VERSION": ("libevent/libevent", "release-"),
              "MEMCACHED_VERSION": ("memcached/memcached", "v"),
          }

          def set_github_output(name, value):
              """Helper to set GitHub Actions output variables."""
              if 'GITHUB_OUTPUT' in os.environ:
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                      f.write(f"{name}={value}\n")

          def fetch_url(url):
              headers = {'User-Agent': 'Mozilla/5.0 (RSS-Bridge Deps Updater)'}
              # Authenticate GitHub API requests to avoid rate limits
              if 'api.github.com' in url and 'GITHUB_TOKEN' in os.environ:
                  headers['Authorization'] = f"token {os.environ['GITHUB_TOKEN']}"
              
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=15) as response:
                  return response.read().decode()

          def get_github_latest(repo):
              """Fetches the latest release or tag from a GitHub repository."""
              try:
                  data = json.loads(fetch_url(f"https://api.github.com/repos/{repo}/releases/latest"))
                  return data['tag_name']
              except Exception:
                  # Fallback to tags if no formal releases exist
                  data = json.loads(fetch_url(f"https://api.github.com/repos/{repo}/tags?per_page=5"))
                  return data[0]['name'] if data else None

          def get_alpine_latest():
              """Fetches the latest stable Alpine Linux tag from Docker Hub."""
              data = json.loads(fetch_url("https://hub.docker.com/v2/repositories/library/alpine/tags?page_size=50"))
              for tag in data['results']:
                  # Match stable versions like 3.20, 3.21 (ignoring 3.21.1 or edge)
                  if re.match(r'^3\.\d+$', tag['name']):
                      return tag['name']
              return "3.20" # Fallback

          def get_freenginx_latest():
              """Parses the official freenginx download page for the stable version."""
              html = fetch_url("https://freenginx.org/en/download.html")
              match = re.search(r'freenginx-([0-9\.]+)\.tar\.gz', html)
              return match.group(1) if match else "1.27.0"

          if len(sys.argv) < 2:
              print("[Error] Dependency name not provided.")
              sys.exit(1)

          target_dep = sys.argv[1]
          if target_dep not in DEPS_CONFIG:
              print(f"[Error] Unknown dependency: {target_dep}")
              sys.exit(1)

          source, strip_pre = DEPS_CONFIG[target_dep]
          dockerfile_path = "Dockerfile"

          if not os.path.exists(dockerfile_path):
              print(f"[Error] {dockerfile_path} not found!")
              sys.exit(1)

          with open(dockerfile_path, "r") as f:
              content = f.read()

          # Extract current version from Dockerfile
          current_match = re.search(rf'^ARG\s+{target_dep}\s*=\s*(.*)$', content, flags=re.MULTILINE)
          if not current_match:
              print(f"[Error] ARG {target_dep} not found in Dockerfile")
              sys.exit(1)
              
          current_version = current_match.group(1).strip()
          print(f"[Info] Current version for {target_dep}: {current_version}")

          # Fetch latest version
          try:
              if source == "alpine_docker":
                  latest_raw = get_alpine_latest()
              elif source == "freenginx":
                  latest_raw = get_freenginx_latest()
              else:
                  latest_raw = get_github_latest(source)

              if not latest_raw:
                  print(f"[Warning] Could not fetch latest version for {target_dep}")
                  sys.exit(0)

              # Clean tag prefix (e.g., "openssl-3.0.1" -> "3.0.1")
              latest_version = latest_raw[len(strip_pre):] if latest_raw.startswith(strip_pre) else latest_raw
              print(f"[Info] Latest version found: {latest_version}")

              if current_version == latest_version:
                  print(f"[Info] {target_dep} is already up-to-date.")
                  set_github_output("updated", "false")
                  sys.exit(0)

              # Update Dockerfile content safely
              pattern = re.compile(rf'^(ARG\s+{target_dep}\s*=\s*).*$')
              new_content, count = pattern.subn(rf'\g<1>{latest_version}', content, flags=re.MULTILINE)
              
              if count > 0:
                  with open(dockerfile_path, "w") as f:
                      f.write(new_content)
                  print(f"[Success] Updated {target_dep} from {current_version} to {latest_version}")
                  set_github_output("updated", "true")
                  set_github_output("new_version", latest_version)
                  set_github_output("old_version", current_version)
              else:
                  print("[Error] Regex failed to update the Dockerfile.")
                  sys.exit(1)

          except Exception as e:
              print(f"[Error] Exception while processing {target_dep}: {str(e)}")
              sys.exit(1)
          EOF
          
          python update_deps.py "${{ matrix.dep }}"

      - name: Create Pull Request
        # Only run this step if the python script found an update and wrote "updated=true"
        if: steps.check_version.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): bump ${{ matrix.dep }} from ${{ steps.check_version.outputs.old_version }} to ${{ steps.check_version.outputs.new_version }}"
          title: "chore(deps): bump ${{ matrix.dep }} to ${{ steps.check_version.outputs.new_version }}"
          body: |
            Automated isolated update for `${{ matrix.dep }}`.
            
            - **Old version:** `${{ steps.check_version.outputs.old_version }}`
            - **New version:** `${{ steps.check_version.outputs.new_version }}`
            
            This PR modifies only the `${{ matrix.dep }}` argument in the Dockerfile.
          # Create a unique branch for each dependency so PRs do not conflict
          branch: "automated/deps/${{ matrix.dep }}"
          delete-branch: true