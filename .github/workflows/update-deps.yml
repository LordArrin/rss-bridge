name: Update Dockerfile Dependencies

on:
  schedule:
    # Runs every Friday at 08:00 UTC
    - cron: '0 8 * * 5'
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  update-dependency:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        dep: [
          "ALPINE_VERSION",
          "NGINX_VERSION",
          "CURL_VERSION",
          "OPENSSL_VERSION",
          "PCRE_VERSION",
          "MIMALLOC_VERSION",
          "ZLIB_NG_VERSION",
          "LIBEVENT_VERSION",
          "MEMCACHED_VERSION"
        ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch latest version and patch Dockerfile
        id: check_version
        env:
          GITHUB_TOKEN: ${{ secrets.PR_CREATE_TOKEN }}
        run: |
          cat << 'EOF' > /tmp/update_deps.py
          import urllib.request
          import json
          import re
          import os
          import sys

          # Configuration mapping: ARG_NAME -> (SOURCE, STRIP_PREFIX, VALID_TAG_REGEX)
          DEPS_CONFIG = {
              "ALPINE_VERSION": ("alpine_docker", "", r"^3\.\d+$"),
              "NGINX_VERSION": ("freenginx", "", r"^\d+\.\d+\.\d+$"),
              "CURL_VERSION": ("lexiforest/curl-impersonate", "v", r"^v?\d+\.\d+\.\d+$"),
              "OPENSSL_VERSION": ("openssl/openssl", "openssl-", r"^openssl-\d+\.\d+\.\d+$"),
              "PCRE_VERSION": ("PCRE2Project/pcre2", "pcre2-", r"^pcre2-\d+\.\d+$"),
              "MIMALLOC_VERSION": ("microsoft/mimalloc", "v", r"^v?\d+\.\d+\.\d+$"),
              "ZLIB_NG_VERSION": ("zlib-ng/zlib-ng", "v", r"^v?\d+\.\d+\.\d+$"),
              "LIBEVENT_VERSION": ("libevent/libevent", "release-", r"^release-\d+\.\d+\.\d+-stable$"),
              "MEMCACHED_VERSION": ("memcached/memcached", "v", r"^\d+\.\d+\.\d+$"),
          }

          def set_github_output(name, value):
              """Helper to set GitHub Actions output variables."""
              if 'GITHUB_OUTPUT' in os.environ:
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                      f.write(f"{name}={value}\n")

          def fetch_url(url, method="GET", data=None):
              headers = {'User-Agent': 'Mozilla/5.0 (RSS-Bridge Deps Updater)'}
              if 'api.github.com' in url and 'GITHUB_TOKEN' in os.environ:
                  headers['Authorization'] = f"token {os.environ['GITHUB_TOKEN']}"
                  headers['Accept'] = 'application/vnd.github.v3+json'
              
              req = urllib.request.Request(url, headers=headers, method=method)
              if data:
                  req.data = json.dumps(data).encode('utf-8')
                  headers['Content-Type'] = 'application/json'
              
              with urllib.request.urlopen(req, timeout=15) as response:
                  return response.read().decode()

          def close_old_prs(dep_name, new_version):
              """Close all open PRs for this dependency except the one with new_version."""
              try:
                  # Get repository info from environment
                  repo = os.environ.get('GITHUB_REPOSITORY', '')
                  if not repo:
                      print("[Warning] GITHUB_REPOSITORY not set, skipping PR cleanup")
                      return
                  
                  # Search for open PRs with branch pattern
                  branch_prefix = f"automated/deps/{dep_name}"
                  url = f"https://api.github.com/repos/{repo}/pulls?state=open&head={repo.split('/')[0]}:{branch_prefix}"
                  
                  response = fetch_url(url)
                  prs = json.loads(response)
                  
                  closed_count = 0
                  for pr in prs:
                      pr_branch = pr.get('head', {}).get('ref', '')
                      pr_number = pr.get('number')
                      pr_title = pr.get('title', '')
                      
                      # Extract version from PR title
                      version_match = re.search(r'to\s+([\d\.]+)', pr_title)
                      if not version_match:
                          continue
                      
                      pr_version = version_match.group(1)
                      
                      # Close PR if it's for an older version
                      if pr_version != new_version:
                          close_url = f"https://api.github.com/repos/{repo}/pulls/{pr_number}"
                          close_data = {
                              "state": "closed",
                              "body": f"Automatically closed: superseded by newer version {new_version}"
                          }
                          try:
                              fetch_url(close_url, method="PATCH", data=close_data)
                              print(f"[Info] Closed outdated PR #{pr_number} (version {pr_version})")
                              closed_count += 1
                          except Exception as e:
                              print(f"[Warning] Failed to close PR #{pr_number}: {str(e)}")
                  
                  if closed_count > 0:
                      print(f"[Info] Closed {closed_count} outdated PR(s) for {dep_name}")
                      
              except Exception as e:
                  print(f"[Warning] Error while closing old PRs: {str(e)}")

          def pr_exists_for_version(dep_name, version):
              """Check if a PR already exists for this specific version."""
              try:
                  repo = os.environ.get('GITHUB_REPOSITORY', '')
                  if not repo:
                      return False
                  
                  # Search for open PRs with this branch
                  branch_name = f"automated/deps/{dep_name}"
                  url = f"https://api.github.com/repos/{repo}/pulls?state=open&head={repo.split('/')[0]}:{branch_name}"
                  
                  response = fetch_url(url)
                  prs = json.loads(response)
                  
                  for pr in prs:
                      pr_title = pr.get('title', '')
                      # Check if PR title contains the exact version
                      if version in pr_title:
                          print(f"[Info] PR already exists for {dep_name} version {version}")
                          return True
                  
                  return False
              except Exception as e:
                  print(f"[Warning] Error checking for existing PR: {str(e)}")
                  return False

          def parse_version(v):
              """Convert version string to tuple of integers for comparison."""
              parts = []
              for p in v.split('.'):
                  try:
                      parts.append(int(p))
                  except ValueError:
                      parts.append(0)
              return tuple(parts)

          def is_newer_version(current, latest):
              """Return True if latest is strictly greater than current."""
              return parse_version(latest) > parse_version(current)

          def version_sort_key(tag):
              """Extracts numbers from a tag string to allow proper numerical sorting."""
              clean = re.sub(r'^[a-zA-Z-]+', '', tag)
              return parse_version(clean)

          def get_github_latest(repo, tag_regex):
              """Fetches the latest valid release or tag from a GitHub repository."""
              # Try latest release first
              try:
                  data = json.loads(fetch_url(f"https://api.github.com/repos/{repo}/releases/latest"))
                  tag = data['tag_name']
                  if re.match(tag_regex, tag):
                      return tag
              except Exception:
                  pass
              
              # Fallback to tags, filter by regex and sort numerically
              try:
                  data = json.loads(fetch_url(f"https://api.github.com/repos/{repo}/tags?per_page=100"))
                  valid_tags = [t['name'] for t in data if re.match(tag_regex, t['name'])]
                  if valid_tags:
                      valid_tags.sort(key=version_sort_key, reverse=True)
                      return valid_tags[0]
              except Exception:
                  pass
              return None

          def get_alpine_latest(tag_regex):
              """Fetches the latest stable Alpine Linux tag from Docker Hub."""
              try:
                  data = json.loads(fetch_url("https://hub.docker.com/v2/repositories/library/alpine/tags?page_size=100"))
                  valid_tags = [t['name'] for t in data['results'] if re.match(tag_regex, t['name'])]
                  if valid_tags:
                      valid_tags.sort(key=lambda x: parse_version(x), reverse=True)
                      return valid_tags[0]
              except Exception:
                  pass
              return "3.24" # Fallback

          def get_freenginx_latest(tag_regex):
              """Parses the official freenginx download page for the stable version."""
              try:
                  html = fetch_url("https://freenginx.org/en/download.html")
                  matches = re.findall(r'freenginx-([0-9\.]+)\.tar\.gz', html)
                  valid_tags = [m for m in matches if re.match(tag_regex, m)]
                  if valid_tags:
                      valid_tags.sort(key=version_sort_key, reverse=True)
                      return valid_tags[0]
              except Exception:
                  pass
              return "1.27.0" # Fallback

          if len(sys.argv) < 2:
              print("[Error] Dependency name not provided.")
              sys.exit(1)

          target_dep = sys.argv[1]
          if target_dep not in DEPS_CONFIG:
              print(f"[Error] Unknown dependency: {target_dep}")
              sys.exit(1)

          source, strip_pre, tag_regex = DEPS_CONFIG[target_dep]
          dockerfile_path = "Dockerfile"

          if not os.path.exists(dockerfile_path):
              print(f"[Error] {dockerfile_path} not found!")
              sys.exit(1)

          with open(dockerfile_path, "r") as f:
              content = f.read()

          # Extract current version from Dockerfile
          current_match = re.search(rf'^ARG\s+{target_dep}\s*=\s*(.*)$', content, flags=re.MULTILINE)
          if not current_match:
              print(f"[Error] ARG {target_dep} not found in Dockerfile")
              sys.exit(1)
              
          current_version = current_match.group(1).strip()
          print(f"[Info] Current version for {target_dep}: {current_version}")

          # Fetch latest version
          try:
              if source == "alpine_docker":
                  latest_raw = get_alpine_latest(tag_regex)
              elif source == "freenginx":
                  latest_raw = get_freenginx_latest(tag_regex)
              else:
                  latest_raw = get_github_latest(source, tag_regex)

              if not latest_raw:
                  print(f"[Warning] Could not fetch a valid latest version for {target_dep}")
                  set_github_output("updated", "false")
                  sys.exit(0)

              # Clean tag prefixes (e.g., "openssl-3.0.1" -> "3.0.1")
              latest_version = latest_raw[len(strip_pre):] if latest_raw.startswith(strip_pre) else latest_raw
              print(f"[Info] Latest valid version found: {latest_version}")

              if current_version == latest_version:
                  print(f"[Info] {target_dep} is already up-to-date.")
                  set_github_output("updated", "false")
                  sys.exit(0)

              # Check if the new version is actually newer (prevent downgrades)
              if not is_newer_version(current_version, latest_version):
                  print(f"[Warning] Found version {latest_version} is older than current {current_version}. Skipping update to prevent downgrade.")
                  set_github_output("updated", "false")
                  sys.exit(0)

              # Check if PR already exists for this version
              if pr_exists_for_version(target_dep, latest_version):
                  print(f"[Info] PR for {target_dep} version {latest_version} already exists. Skipping.")
                  set_github_output("updated", "false")
                  sys.exit(0)

              # Close outdated PRs for this dependency
              close_old_prs(target_dep, latest_version)

              # Safely update the Dockerfile using re.subn with MULTILINE flag
              pattern_str = rf'^(ARG\s+{target_dep}\s*=\s*).*$'
              new_content, count = re.subn(pattern_str, rf'\g<1>{latest_version}', content, flags=re.MULTILINE)
              
              if count > 0:
                  with open(dockerfile_path, "w") as f:
                      f.write(new_content)
                  print(f"[Success] Updated {target_dep} from {current_version} to {latest_version}")
                  set_github_output("updated", "true")
                  set_github_output("new_version", latest_version)
                  set_github_output("old_version", current_version)
              else:
                  print("[Error] Regex failed to update the Dockerfile.")
                  sys.exit(1)

          except Exception as e:
              print(f"[Error] Exception while processing {target_dep}: {str(e)}")
              sys.exit(1)
          EOF
          
          python /tmp/update_deps.py "${{ matrix.dep }}"

      - name: Create Pull Request
        if: steps.check_version.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PR_CREATE_TOKEN }}
          commit-message: "chore(deps): bump ${{ matrix.dep }} from ${{ steps.check_version.outputs.old_version }} to ${{ steps.check_version.outputs.new_version }}"
          title: "chore(deps): bump ${{ matrix.dep }} to ${{ steps.check_version.outputs.new_version }}"
          body: |
            Automated isolated update for `${{ matrix.dep }}`.
            
            - **Old version:** `${{ steps.check_version.outputs.old_version }}`
            - **New version:** `${{ steps.check_version.outputs.new_version }}`
            
            This PR modifies only the `${{ matrix.dep }}` argument in the Dockerfile.
            
            *Note: Any previous PRs for older versions of this dependency have been automatically closed.*
          branch: "automated/deps/${{ matrix.dep }}"
          delete-branch: true