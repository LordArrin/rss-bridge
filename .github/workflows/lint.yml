name: Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  # ─── Syntax check: every .php file must parse on PHP 8.5 ───
  syntax:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: php -l on all PHP files
        run: |
          errors=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" > /dev/null 2>&1; then
              echo "::error file=${file}::Syntax error"
              php -l "$file" 2>&1
              errors=$((errors + 1))
            fi
          done < <(find . -name '*.php' \
            -not -path './vendor/*' \
            -not -path './static/*' \
            -print0)
          if [ "$errors" -gt 0 ]; then
            echo "::error::${errors} file(s) have syntax errors"
            exit 1
          fi
          echo "✓ All PHP files pass syntax check"

  # ─── Code style: phpcs ───
  phpcs:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          # Важно: нужен токен с правами на запись, чтобы сделать коммит
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: phpcs
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --quiet

      # 1. First, we try to automatically fix everything that can be done
      - name: Auto-fix coding standards
        run: vendor/bin/phpcbf . --standard=phpcs.xml --extensions=php -p || true

      # 2. Check if there are any errors left after this
      - name: Check coding standards
        id: phpcs-check
        run: |
          if ! vendor/bin/phpcs . --standard=phpcs.xml --warning-severity=0 --extensions=php -p; then
            echo "failed=true" >> $GITHUB_OUTPUT
          fi

      # 3. If there were any fixes, commit and push (only for branches of the main repo)
      - name: Commit and push PHPCBF fixes
        if: steps.phpcs-check.outputs.failed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "style: auto-fix PHPCS violations"
          commit_options: "--no-verify"
          file_pattern: "*.php"
          
      # 4. If PHPCBF couldn't fix something, fail the build
      - name: Fail if unfixable errors remain
        if: steps.phpcs-check.outputs.failed == 'true'
        run: |
          echo "::error::PHPCS errors remain after PHPCBF auto-fix. Please run 'vendor/bin/phpcbf .' locally and push."
          exit 1
          
  # ─── Static analysis: PHPStan ───
  phpstan:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - run: composer install --no-interaction --quiet
      - run: vendor/bin/phpstan analyse --no-progress --error-format=github

  # ─── No executable .php files ───
  executable_check:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - run: |
          if find . -name '*.php' -not -path './vendor/*' -executable -type f -print -exec false {} +; then
            echo '✓ No executable PHP files found'
          else
            echo '::error::PHP files above are marked executable — run chmod -x'
            exit 1
          fi

  # ─── PHP 8.5 specific deprecation grep ───
  deprecations:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Check for known PHP 8.5 incompatibilities
        run: |
          errors=0

          echo "--- curl_close() (deprecated 8.5) ---"
          if grep -rn "curl_close\s*(" bridges/ lib/ actions/ --include='*.php'; then
            echo "::warning::curl_close() is deprecated in PHP 8.5 — remove these calls"
          fi

          echo "--- \$http_response_header (deprecated 8.5) ---"
          if grep -rn '\$http_response_header' bridges/ lib/ actions/ --include='*.php'; then
            echo "::error::\$http_response_header is deprecated — use http_get_last_response_headers()"
            errors=$((errors + 1))
          fi

          echo "--- utf8_encode/utf8_decode (removed) ---"
          if grep -rn 'utf8_encode\s*(\|utf8_decode\s*(' bridges/ lib/ actions/ --include='*.php'; then
            echo "::error::utf8_encode/utf8_decode removed — use mb_convert_encoding()"
            errors=$((errors + 1))
          fi

          echo "--- create_function() (removed) ---"
          if grep -rn 'create_function\s*(' bridges/ lib/ actions/ --include='*.php'; then
            echo "::error::create_function() removed — use closures"
            errors=$((errors + 1))
          fi

          if [ "$errors" -gt 0 ]; then
            echo "::error::${errors} critical incompatibility(ies) found"
            exit 1
          fi
          echo "✓ No critical PHP 8.5 incompatibilities"