name: Build and Push Multi-Arch Images

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lordarrin/rss-bridge

jobs:
  build-amd64:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push latest-modern (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-modern-amd64
          build-args: |
            X86_MARCH=x86-64-v3
            X86_MTUNE=generic
            X86_CFI_FLAGS=-fcf-protection=full
            BUILD_JOBS=2
            ENABLE_LTO=ON
          cache-from: type=gha,scope=amd64-modern
          cache-to: type=gha,mode=max,scope=amd64-modern

      - name: Build and push latest (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-amd64
          build-args: |
            X86_MARCH=x86-64
            X86_MTUNE=generic
            X86_CFI_FLAGS=
            BUILD_JOBS=2
            ENABLE_LTO=ON
          cache-from: type=gha,scope=amd64-base
          cache-to: type=gha,mode=max,scope=amd64-base

  build-arm64:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push latest-modern (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-modern-arm64
          build-args: |
            ARM_MARCH=armv8.2-a+crypto+crc+lse+rdma
            ARM_MTUNE=generic
            ARM_CFI_FLAGS=-mbranch-protection=standard
            BUILD_JOBS=2
            ENABLE_LTO=ON
          cache-from: type=gha,scope=arm64-modern
          cache-to: type=gha,mode=max,scope=arm64-modern

      - name: Build and push latest (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-arm64
          build-args: |
            ARM_MARCH=armv8-a
            ARM_MTUNE=generic
            ARM_CFI_FLAGS=-mbranch-protection=standard
            BUILD_JOBS=2
            ENABLE_LTO=ON
          cache-from: type=gha,scope=arm64-base
          cache-to: type=gha,mode=max,scope=arm64-base

  create-manifests:
    runs-on: ubuntu-26.04
    needs: [build-amd64, build-arm64]
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push latest-modern manifest
        run: |
          docker buildx imagetools create -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-modern \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-modern-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-modern-arm64

      - name: Create and push latest manifest
        run: |
          docker buildx imagetools create -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-arm64

  create-release:
    runs-on: ubuntu-26.04
    needs: create-manifests
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false