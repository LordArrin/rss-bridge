name: Build Multi-Arch Images

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  IMAGE_NAME: rss-bridge

jobs:
  build-amd64:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build latest-modern (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_NAME }}:latest-modern-amd64
          build-args: |
            X86_MARCH=x86-64-v3
            X86_MTUNE=generic
            X86_CFI_FLAGS=-fcf-protection=full
            BUILD_JOBS=2
            ENABLE_LTO=ON

      - name: Build latest (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_NAME }}:latest-amd64
          build-args: |
            X86_MARCH=x86-64
            X86_MTUNE=generic
            X86_CFI_FLAGS=
            BUILD_JOBS=2
            ENABLE_LTO=ON

      - name: Save images to tar
        run: |
          docker save ${{ env.IMAGE_NAME }}:latest-modern-amd64 -o latest-modern-amd64.tar
          docker save ${{ env.IMAGE_NAME }}:latest-amd64 -o latest-amd64.tar

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amd64-images
          path: |
            latest-modern-amd64.tar
            latest-amd64.tar
          retention-days: 7

  build-arm64:
    runs-on: ubuntu-26.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build latest-modern (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: ${{ env.IMAGE_NAME }}:latest-modern-arm64
          build-args: |
            ARM_MARCH=armv8.2-a+crypto+crc+lse+rdma
            ARM_MTUNE=generic
            ARM_CFI_FLAGS=-mbranch-protection=standard
            BUILD_JOBS=2
            ENABLE_LTO=ON

      - name: Build latest (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: ${{ env.IMAGE_NAME }}:latest-arm64
          build-args: |
            ARM_MARCH=armv8-a
            ARM_MTUNE=generic
            ARM_CFI_FLAGS=-mbranch-protection=standard
            BUILD_JOBS=2
            ENABLE_LTO=ON

      - name: Save images to tar
        run: |
          docker save ${{ env.IMAGE_NAME }}:latest-modern-arm64 -o latest-modern-arm64.tar
          docker save ${{ env.IMAGE_NAME }}:latest-arm64 -o latest-arm64.tar

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arm64-images
          path: |
            latest-modern-arm64.tar
            latest-arm64.tar
          retention-days: 7