name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, mbstring, intl, xml, simplexml, sqlite3, zip, dom, ctype, filter
          coverage: none
      - run: composer install --no-interaction --quiet
      - run: mkdir -p cache
      - run: vendor/bin/phpunit --testsuite=unit

  integration:
    runs-on: ubuntu-24.04
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, mbstring, intl, xml, simplexml, sqlite3, zip, dom, ctype, filter
          coverage: none
      - run: composer install --no-interaction --quiet
      - run: mkdir -p cache
      - run: vendor/bin/phpunit --testsuite=integration